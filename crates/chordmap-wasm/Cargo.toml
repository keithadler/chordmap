[package]
name = "chordmap-wasm"
description = "WebAssembly bindings for chordmap"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
chordmap.workspace = true
wasm-bindgen = "0.2"
serde_json.workspace = true

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O3", "--enable-nontrapping-float-to-int", "--enable-bulk-memory", "--enable-sign-ext", "--enable-mutable-globals"]

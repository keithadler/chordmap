name: Deploy web app to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - run: ./scripts/build-wasm.sh
      - run: ./scripts/fetch-vendor.sh
      - name: Assemble site
        run: |
          mkdir -p site/pkg site/vendor
          cp -r examples/web/icons site/icons
          cp -r examples/web/mac site/mac
          cp -r examples/web/vendor/. site/vendor/
          cp examples/web/index.html examples/web/app.js examples/web/worker.js examples/web/chords-guitar.js examples/web/export.js examples/web/library.js examples/web/waveform.js examples/web/visualizer.js examples/web/stems.js examples/web/mix.js examples/web/lyrics.js examples/web/sw.js examples/web/manifest.webmanifest site/
          sed -i "s/?v=dev/?v=${GITHUB_SHA::8}/g" site/index.html site/app.js site/worker.js site/chords-guitar.js site/export.js site/library.js site/waveform.js site/visualizer.js site/stems.js site/mix.js site/lyrics.js
          sed -i "s/__VERSION__/${GITHUB_SHA::8}/g" site/sw.js
          cp pkg/chordmap.js pkg/chordmap_bg.wasm site/pkg/
          touch site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
